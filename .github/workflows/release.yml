name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}"
          CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
            go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/synapse-${GOOS}-${GOARCH}" ./cmd/synapse
          chmod +x "dist/synapse-${GOOS}-${GOARCH}"
      - uses: actions/upload-artifact@v4
        with:
          name: synapse-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/synapse-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum synapse-* > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/synapse-*
            dist/checksums.txt
          generate_release_notes: true

  npm-publish:
    needs: build
    runs-on: ubuntu-latest
    # Skipped cleanly until the NPM_TOKEN secret is configured; binaries on
    # the GitHub Release are always published.
    if: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Stage platform packages
        run: |
          mkdir -p npm/linux-x64/bin npm/linux-arm64/bin npm/darwin-x64/bin npm/darwin-arm64/bin
          cp dist/synapse-linux-amd64  npm/linux-x64/bin/synapse
          cp dist/synapse-linux-arm64  npm/linux-arm64/bin/synapse
          cp dist/synapse-darwin-amd64 npm/darwin-x64/bin/synapse
          cp dist/synapse-darwin-arm64 npm/darwin-arm64/bin/synapse
          chmod +x npm/*/bin/synapse
      - name: Stamp versions
        env:
          REF_NAME: ${{ github.ref_name }}
        run: node scripts/npm-set-version.js "${REF_NAME#v}"
      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for d in npm/linux-x64 npm/linux-arm64 npm/darwin-x64 npm/darwin-arm64; do
            (cd "$d" && npm publish --access public)
          done
      - name: Publish root package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: cd npm && npm publish --access public
