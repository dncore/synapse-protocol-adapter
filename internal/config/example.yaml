# synapse example configuration.
#
# The proxy forwards the client's Authorization header verbatim and needs
# no credentials to run. The only optional exception is users.keys below:
# registering keys there for per-user queueing stores them hashed (never
# in plaintext) — or use key_hash from the start and keep even the config
# file credential-free.

server:
  # Listen address. 0.0.0.0 exposes the proxy to the LAN (see README:
  # Security). Use 127.0.0.1 to restrict to localhost.
  listen: "0.0.0.0:8787"
  # Serve HTTP and HTTPS on the listen address at the same time — the
  # wire protocol is auto-detected per connection, so plain-HTTP clients
  # keep working while https-only agents get TLS. Independent of the
  # upstream scheme: upstream.base_url keeps its own http:// or https://.
  tls:
    enabled: false
    # Bring your own certificate (Let's Encrypt, internal CA, mkcert):
    # both files must be set together; nothing is generated when set.
    # cert_file: /path/to/cert.pem
    # key_file: /path/to/key.pem
    # Without cert/key files a self-signed CA + server certificate is
    # generated on first start and persisted here (default:
    # ~/.config/synapse/tls). Clients fetch the CA with
    #   curl -k https://<host>:<port>/ca.pem
    # and follow https://<host>:<port>/tls-help to import it (macOS,
    # Linux, Windows). Importing once is enough: re-signing the server
    # certificate keeps the same CA.
    # auto_dir: /var/lib/synapse/tls
    # Extra DNS names / IPs for the generated certificate's SANs. The
    # defaults already cover localhost, the machine hostname, and every
    # interface IP. After deployment, add names live without editing this
    # file: `synapse tls add <name>` (re-signs the leaf under the same CA
    # and SIGHUPs the daemon); `synapse tls list` shows everything.
    # sans: ["mybox.example.com"]

upstream:
  # Base URL of the OpenAI-compatible chat completions provider.
  # Everything before the path; the proxy appends upstream.path.
  base_url: "http://127.0.0.1:8000/v1"
  # Appended to base_url. Default: /chat/completions
  # Set to /completions only for legacy non-chat providers (no tools).
  path: "/chat/completions"

limits:
  # Max in-flight proxy requests; further requests queue (backpressure).
  # 0 = unlimited (trusted/internal deployments; upstream sets the pace).
  max_concurrency: 200
  # Max client request body size (bytes).
  max_body_bytes: 67108864        # 64 MiB
  # Max single SSE data line (large tool arguments arrive as one line).
  max_sse_line_bytes: 16777216    # 16 MiB

# Per-API-key concurrency queueing. Opt-in: absent or enabled:false means
# no per-user limiting (all requests pass as before). When enabled, EVERY
# key — listed or not — queues at the same default limit; there is no
# unregistered-key bypass.
users:
  enabled: false
  # Concurrent upstream requests allowed per user. Requests beyond this
  # wait in a FIFO queue instead of hitting the upstream's own limits.
  # A streaming request holds its slot until the last byte. Default 90:
  # just under gateways that 429 around 100 concurrent requests per key.
  default_concurrency: 90
  # Requests per user that may wait for a slot; beyond this the proxy
  # answers 429 immediately with Retry-After. 0 = unlimited queue.
  max_queue: 128
  # Max time a request may wait in the queue before the proxy answers 429.
  # Queued requests cannot receive any bytes (not even SSE keep-alives),
  # so this must end before clients time out and retry on their own.
  queue_timeout: 120s
  # Optional per-user names and concurrency overrides. Listing is never
  # required for limiting — every key queues at default_concurrency. Give
  # a raw key (hashed at load — plaintext never persists in the running
  # config or logs) or a sha256:<64 hex> hash computed with, e.g.,
  #   printf %s "Bearer sk-..." | sha256sum
  keys: []
  # keys:
  #   - name: dean
  #     key: "Bearer sk-live-..."
  #     concurrency: 90
  #   - name: ci
  #     key_hash: "sha256:9f3a...64hex"

timeouts:
  connect: 10s        # TCP/TLS connect to upstream
  request: 30m        # total per-request ceiling (long generations)
  idle: 5m            # idle keep-alive connections
  stream_write: 5m    # max stall writing to a slow streaming client
  header_write: 60s   # max wait for client request headers

shutdown:
  # Grace period for in-flight requests (incl. streaming) on SIGTERM.
  timeout: 30s

log:
  format: json        # json | text
  level: info         # debug | info | warn | error

# Every value above can be overridden via environment variables:
#   PROXY_SERVER_LISTEN, PROXY_SERVER_TLS_ENABLED,
#   PROXY_SERVER_TLS_CERT_FILE, PROXY_SERVER_TLS_KEY_FILE,
#   PROXY_SERVER_TLS_AUTO_DIR, PROXY_SERVER_TLS_SANS (comma-separated),
#   PROXY_UPSTREAM_BASE_URL, PROXY_UPSTREAM_PATH,
#   PROXY_LIMITS_MAX_CONCURRENCY, PROXY_LIMITS_MAX_BODY_BYTES,
#   PROXY_USERS_ENABLED, PROXY_USERS_DEFAULT_CONCURRENCY,
#   PROXY_USERS_MAX_QUEUE, PROXY_USERS_QUEUE_TIMEOUT,
#   PROXY_TIMEOUTS_CONNECT, PROXY_TIMEOUTS_REQUEST, PROXY_TIMEOUTS_IDLE,
#   PROXY_TIMEOUTS_STREAM_WRITE, PROXY_SHUTDOWN_TIMEOUT,
#   PROXY_LOG_FORMAT, PROXY_LOG_LEVEL
